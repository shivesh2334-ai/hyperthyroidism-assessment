<body>
<header><h1>🦋 Hyperthyroidism Assessment</h1><div class="sub">Thyrotoxicosis · Harrison’s Ch.384 (Jameson, Mandel, Weetman), pp.2938–2945</div></header>
<nav id="nav"></nav>
<main id="main"></main>
<div class="foot">Educational decision-support from the source chapter. Clinical judgement and local protocols prevail; verify doses before use.</div>
<script>
const TABS=["Assess","Pathophysiology","Learn","Treatment","Indian Medicines"];
let tab=0;
const SYM=["Hyperactivity, irritability, dysphoria","Heat intolerance and sweating","Palpitations","Fatigue and weakness","Weight loss with increased appetite","Diarrhea / increased stool frequency","Polyuria","Oligomenorrhea, loss of libido"];
const SIGN=["Tachycardia (AF in the elderly)","Tremor","Goiter","Warm, moist skin","Proximal muscle weakness","Lid retraction or lag","Gynecomastia"];
const STORM=["Fever","Delirium / seizures / coma","Vomiting, diarrhea or jaundice","Marked tachycardia / arrhythmia or heart failure","Precipitant: infection, surgery, trauma, DKA, RAI in untreated patient"];
const CTX=[
["gd","Diffuse goiter, thrill or bruit"],["oph","Ophthalmopathy (proptosis, diplopia, chemosis)"],["derm","Thyroid dermopathy or acropachy"],["ab","TRAb or TPO antibodies positive"],
["nod","Multinodular goiter or solitary nodule"],["pain","Painful, tender thyroid"],["esr","High ESR"],["pp","Postpartum (3–6 months)"],
["amio","Amiodarone use"],["iod","Iodine excess (contrast, supplements)"],["ifn","IFN-α, TKI or checkpoint inhibitor"],["exo","Exogenous thyroid hormone use"],
["preg","Pregnant / planning pregnancy"],["af","Atrial fibrillation / heart disease"],["smk","Smoker"],["old","Age ≥60 or apathetic picture"]];
const POS={};
const sel=(id,l,opts)=>`<div><div class="fl">${l}</div><select id="${id}">${opts.map(o=>`<option value="${o[0]}">${o[1]}</option>`).join("")}</select></div>`;
const ck=(p,a)=>a.map((x,i)=>`<label class="ck"><input type="checkbox" data-g="${p}" value="${i}"><span>${x}</span></label>`).join("");

function nav(){document.getElementById("nav").innerHTML=TABS.map((t,i)=>`<button class="${i==tab?"on":""}" aria-current="${i==tab?"page":"false"}" onclick="go(${i})">${t}</button>`).join("")}
function go(i){tab=i;nav();render();document.querySelector("nav button.on").scrollIntoView({block:"nearest",inline:"nearest"});scrollTo(0,0)}

function assessView(){return `
<div class="card"><h2>1 · Symptoms &amp; signs</h2><div class="fl">Table 384-2, descending frequency</div>
<h3>Symptoms</h3>${ck("sym",SYM)}<h3>Signs</h3>${ck("sign",SIGN)}</div>
<div class="card"><h2>2 · Laboratory &amp; imaging</h2><div class="grid">
${sel("tsh","TSH",[["","Not available"],["low","Low / suppressed"],["norm","Normal"],["high","Increased"]])}
${sel("ft4","Unbound T4",[["","Not available"],["high","High"],["norm","Normal"],["low","Low"]])}
${sel("t3","Unbound / total T3",[["","Not available"],["high","High"],["norm","Normal"]])}
${sel("up","Radionuclide uptake (99mTc, 123I)",[["","Not done"],["dif","High, diffuse"],["nodu","High, focal / nodular"],["low","Low / absent"]])}
</div></div>
<div class="card"><h2>3 · Clinical context</h2>${CTX.map(c=>`<label class="ck"><input type="checkbox" data-g="ctx" value="${c[0]}"><span>${c[1]}</span></label>`).join("")}</div>
<div class="card"><h2>4 · Thyroid storm screen</h2>${ck("storm",STORM)}</div>
<button class="btn" onclick="run()">Assess</button><button class="btn sec" onclick="render()">Reset</button>
<div id="out"></div>`}

function vals(g){return [...document.querySelectorAll(`input[data-g="${g}"]:checked`)].map(e=>e.value)}
function R(cls,t,items){return `<div class="res ${cls}"><b class="t">${t}</b>${Array.isArray(items)?"<ul>"+items.map(i=>`<li>${i}</li>`).join("")+"</ul>":items}</div>`}

function run(){
const v=id=>document.getElementById(id).value, c=vals("ctx"), h=x=>c.includes(x);
const ns=vals("sym").length, ng=vals("sign").length, st=vals("storm").length;
const tsh=v("tsh"),ft4=v("ft4"),t3=v("t3"),up=v("up");
let o="";
o+=R(st>=2?"warn":st==1?"":"ok","Thyroid storm screen",st>=2?["<b>Possible thyrotoxic crisis</b> (mortality up to 30% even with treatment): intensive monitoring, supportive care, treat precipitant.","See Treatment tab → Thyroid storm."]:st==1?["One storm feature present: reassess closely with vitals and mental status."]:["No storm features ticked."]);
o+=R("",`Clinical picture`,[`${ns}/8 typical symptoms, ${ng}/7 typical signs ticked (tally only, not a validated score).`,h("old")?"Elderly: features may be subtle or masked; apathetic thyrotoxicosis presents with fatigue and weight loss and can mimic depression.":"Normal TSH and unbound T4/T3 exclude thyrotoxicosis; clinical features alone can mimic panic, mania, pheochromocytoma or malignancy."]);
// pattern
let pat="",dx=[],next=[],tone="";
if(!tsh&&!ft4){pat="Enter TSH and unbound T4 to follow the Fig. 384-2 algorithm.";}
else if(tsh==="low"&&ft4==="high"||(tsh==="low"&&t3==="high"&&ft4!=="low")){
 pat=ft4==="high"?"Low TSH + high unbound T4 → primary thyrotoxicosis":"Low TSH + normal T4 + high T3 → T3 toxicosis (primary thyrotoxicosis)";
 tone="warn";
 const gf=h("gd")||h("oph")||h("derm")||h("ab");
 if(h("oph")||h("derm")){dx.push("<b>Graves’ disease</b> (ophthalmopathy / dermopathy are specific)");}
 if(gf&&!dx.length)dx.push("<b>Graves’ disease likely</b> (diffuse goiter and/or TPO/TRAb positivity)");
 if(up==="dif")dx.push("High diffuse uptake supports <b>Graves’ disease</b>");
 if(up==="nodu"||(!gf&&h("nod")))dx.push("<b>Toxic multinodular goiter or toxic adenoma</b> (confirm by radionuclide scan)");
 if(up==="low"||h("pain")||h("esr")||h("pp")||h("exo")||h("iod")||h("amio")||h("ifn")){
  const l=[];
  if(h("pain")||h("esr"))l.push("subacute (de Quervain) thyroiditis");
  if(h("pp"))l.push("silent / postpartum thyroiditis");
  if(h("amio"))l.push("amiodarone-induced thyrotoxicosis (type 1 vs type 2)");
  if(h("iod"))l.push("iodine-induced (Jod-Basedow)");
  if(h("ifn"))l.push("drug-induced painless thyroiditis");
  if(h("exo"))l.push("thyrotoxicosis factitia");
  if(up==="low"&&!l.length)l.push("destructive thyroiditis, iodine excess, exogenous hormone, or ectopic thyroid tissue (struma ovarii)");
  dx.push("Low-uptake <b>thyrotoxicosis without hyperthyroidism</b>: "+l.join("; "));
 }
 if(!dx.length)dx.push("Primary thyrotoxicosis; cause undetermined. Look for Graves’ features, then scan.");
 next=["If unclear clinically: radionuclide (99mTc, 123I or 131I) scan and uptake; TRAb is increasingly used instead of scanning.","Colour-flow Doppler: increased flow in hyperthyroidism, reduced in destructive thyroiditis.","Check LFTs, bilirubin, ferritin, CBC (abnormalities can cause diagnostic confusion).","Measure TPO antibodies/TRAb only if cause unclear; TRAb is needed in pregnancy."];
 if(h("pain")||h("esr"))next.push("Subacute thyroiditis: ESR high, uptake <5%, thyroid antibodies negative; FNA if doubt.");
}
else if(tsh==="low"&&ft4==="norm"&&t3==="norm"){pat="Low TSH + normal T4 + normal T3 → subclinical hyperthyroidism";tone="";dx.push("Subclinical hyperthyroidism");next=["Follow up in 6–12 weeks (Fig. 384-2).","Consider early excess-iodine or non-thyroidal illness, and AF/bone risk in older patients."];}
else if(tsh==="low"&&ft4==="norm"&&!t3){pat="Low TSH + normal T4 → measure T3";dx.push("T3 toxicosis vs subclinical hyperthyroidism");next=["Measure unbound T3: high = T3 toxicosis; normal = subclinical, follow up in 6–12 weeks."];}
else if((tsh==="norm"||tsh==="high")&&ft4==="high"){pat="Non-suppressed TSH + high unbound T4 → secondary thyrotoxicosis";tone="warn";dx.push("<b>TSH-secreting pituitary adenoma</b> or <b>thyroid hormone resistance syndrome</b>");next=["Elevated α-subunit of TSH supports adenoma; MRI/CT of pituitary; diffuse goiter is common.","Assay interference should be excluded; refer to endocrinology (transsphenoidal surgery, irradiation, octreotide)."];}
else if((tsh==="norm")&&ft4==="norm"){pat="Normal TSH and unbound T4 → no further tests";tone="ok";dx.push("Thyrotoxicosis effectively excluded; a normal TSH also excludes Graves’ disease as a cause.");}
else {pat="Pattern does not fit thyrotoxicosis (e.g., high TSH with low T4 suggests hypothyroidism).";dx.push("Review the hypothyroidism pathway if TSH is high and T4 low.");}
o+=R(tone,"Biochemical pattern",pat);
if(dx.length)o+=R(tone==="ok"?"ok":"","Likely diagnosis",dx);
if(next.length)o+=R("","Suggested work-up",next);
// treatment pointers
const t=[];
const prim=(tsh==="low"&&(ft4==="high"||t3==="high"));
if(prim){
 t.push("Symptom control: propranolol 20–40 mg every 6 h (or atenolol) while antithyroid drugs take effect; helpful in thyrotoxic periodic paralysis.");
 if(h("gd")||h("oph")||h("derm")||h("ab")||up==="dif")t.push("Graves’: thionamide (methimazole/carbimazole or PTU) titration or block-replace, radioiodine, or thyroidectomy.");
 if(up==="nodu")t.push("Toxic nodular disease: radioiodine or surgery are the definitive options (antithyroid drugs do not induce remission).");
 if(h("preg"))t.push("<b>Pregnancy</b>: radioiodine contraindicated. PTU until 14–16 weeks, then switch to methimazole; titrate to free T4 at/just above upper reference.");
 if(h("af"))t.push("AF or heart disease: consider anticoagulation with cardiology; digoxin response may change with thyroid status; hyperthyroidism increases warfarin sensitivity, so adjust warfarin by INR and monitor closely as thyroid status changes; AF often converts once euthyroid.");
 if(h("smk")||h("oph"))t.push("Smoking worsens Graves’ ophthalmopathy; advise cessation. If RAI is used with eye disease, consider prednisone cover.");
 if(h("pain")||h("esr"))t.push("Subacute thyroiditis: aspirin (e.g., 600 mg q4–6 h) or NSAIDs; glucocorticoids (prednisone 15–40 mg) if severe.");
 if(h("pp"))t.push("Silent thyroiditis: β-blocker only; no glucocorticoids; recheck function every 2–4 weeks then annually.");
 if(h("amio"))t.push("Amiodarone-induced: type 1 → thionamides ± perchlorate; type 2 → glucocorticoids (prednisone ~40 mg); stop drug if cardiac status allows.");
}
if(t.length)o+=R("ok","Treatment pointers (see Treatment tab)",t);
document.getElementById("out").innerHTML=o;
document.getElementById("out").scrollIntoView({behavior:"smooth"});
}

const PATH=[
["Graves’ disease (60–80% of thyrotoxicosis)",["Thyroid-stimulating immunoglobulins (TSI) are made by lymphocytes in thyroid, bone marrow and lymph nodes; they bind the TSH receptor and drive hormone synthesis.","TRAb positivity implies TSI; important in pregnancy as TSI crosses the placenta (neonatal thyrotoxicosis).","Genetics: HLA-DR, CTLA-4, CD25, PTPN22, FCRL3, CD226 and TSH-R; concordance 20–30% in monozygotic vs <5% in dizygotic twins.","Triggers: stress, smoking (also major risk for ophthalmopathy), iodine intake, postpartum period (threefold rise), immune reconstitution after HAART or alemtuzumab, checkpoint inhibitors.","TPO/Tg antibodies occur in up to 80% but do not correlate with hormone levels."]],
["Ophthalmopathy and dermopathy",["T-cell infiltration of extraocular muscles; IFN-γ, TNF and IL-1 activate fibroblasts, increasing glycosaminoglycans that trap water → muscle swelling.","Later: irreversible fibrosis of muscles; retrobulbar fat expansion raises intra-orbital pressure → proptosis, diplopia, optic neuropathy.","TSH-R is an autoantigen expressed in orbital tissue; IGF-1R signalling is also implicated (basis for teprotumumab).","Course: worsens 3–6 months, plateau 12–18 months, then partial improvement; fulminant in up to 5%."]],
["Toxic multinodular goiter / adenoma",["Autonomous follicular cells; hyperfunction independent of TSH.","Other causes: activating TSH-R or Gsα mutations (McCune-Albright), functioning metastatic carcinoma, struma ovarii."]],
["Destructive (sub)acute thyroiditis",["Patchy inflammation, follicular disruption and multinucleated giant cells → release of Tg and preformed T4/T3, TSH suppression.","Phases: thyrotoxic (uptake low, ESR high) → hypothyroid (low T4, TSH up to ~weeks 6–12+) → recovery; ~15% develop late permanent hypothyroidism.","Viral trigger (mumps, coxsackie, influenza, adenovirus, SARS-CoV-2 reported); peak age 30–50, women 3× more."]],
["Amiodarone, iodine and drugs",["Amiodarone is 39% iodine by weight: Type 1 AIT (underlying nodular/Graves’, Jod-Basedow) vs Type 2 AIT (destructive thyroiditis, lysosomal activation).","Type 1: increased vascularity on Doppler; Type 2: decreased vascularity; uptake normal/increased favours type 1.","IFN-α, TKIs and checkpoint inhibitors can cause painless thyroiditis (up to ~5%)."]],
["Secondary causes",["TSH-secreting adenoma or thyroid hormone resistance: inappropriately normal/high TSH with high T4/T3; elevated α-subunit of TSH.","hCG-mediated (gestational / trophoblastic) thyrotoxicosis: TSH low."]]];

const LEARN=`
<div class="card"><h2>Causes of thyrotoxicosis (Table 384-1)</h2><div class="scroll"><table class="tbl">
<tr><th>Group</th><th>Examples</th></tr>
<tr><td>Primary hyperthyroidism</td><td>Graves’, toxic MNG, toxic adenoma, functioning metastases, activating TSH-R/Gsα mutations, struma ovarii, iodine excess</td></tr>
<tr><td>Without hyperthyroidism</td><td>Subacute thyroiditis, silent thyroiditis, amiodarone/radiation/infarction, excess hormone ingestion (factitia)</td></tr>
<tr><td>Secondary</td><td>TSH-secreting adenoma, thyroid hormone resistance, hCG-secreting tumours, gestational thyrotoxicosis</td></tr></table></div></div>
<div class="card"><h2>NO SPECS (ophthalmopathy)</h2><table class="tbl">
<tr><td>0</td><td><b>N</b>o signs or symptoms</td></tr><tr><td>1</td><td><b>O</b>nly signs (lid retraction or lag)</td></tr><tr><td>2</td><td><b>S</b>oft-tissue involvement</td></tr><tr><td>3</td><td><b>P</b>roptosis (&gt;22 mm)</td></tr><tr><td>4</td><td><b>E</b>xtraocular muscle involvement (diplopia)</td></tr><tr><td>5</td><td><b>C</b>orneal involvement</td></tr><tr><td>6</td><td><b>S</b>ight loss</td></tr></table>
<p class="sub">Inadequate for full description; EUGOGO activity scoring is preferred for monitoring. Refer to an ophthalmologist when active/severe.</p></div>
<div class="card"><h2>Subacute thyroiditis: lab phases</h2><table class="tbl"><tr><th>Phase</th><th>Findings</th></tr>
<tr><td>Thyrotoxic (0–~6 wk)</td><td>↑ T4/T3, TSH suppressed, ↑ ESR, uptake &lt;5%</td></tr>
<tr><td>Hypothyroid</td><td>Low unbound T4, TSH moderately raised</td></tr>
<tr><td>Recovery</td><td>Normalisation over months</td></tr></table></div>
<div class="card"><h2>Key points</h2><ul>
<li>Thyrotoxicosis ≠ hyperthyroidism: thyroiditis causes hormone excess without increased synthesis.</li>
<li>In 2–5% of Graves’ patients only T3 is raised (T3 toxicosis).</li>
<li>Graves’ is 10× commoner in women; peak 20–50 years.</li>
<li>Untreated mortality 10–30%; ~15% become hypothyroid 10–15 years after remission.</li>
<li>Dermopathy (&lt;5%) is almost always with ophthalmopathy; acropachy &lt;1%.</li></ul></div>
<div class="card"><h2>Quick quiz</h2><div id="quiz"></div></div>`;

const QZ=[
["Low TSH, normal T4, high T3 is called:",["Subclinical hyperthyroidism","T3 toxicosis","Secondary thyrotoxicosis"],1],
["Which drug is preferred for thyroid storm because it also blocks T4→T3?",["Methimazole","Propylthiouracil","Carbimazole"],1],
["Radioiodine is absolutely contraindicated in:",["Smokers","Pregnancy and breast-feeding","Elderly"],1],
["Most serious antithyroid drug adverse effect to warn patients about:",["Rash","Agranulocytosis","Arthralgia"],1],
["Subacute thyroiditis typically shows:",["High ESR and low radioiodine uptake","Low ESR and high uptake","Positive TRAb"],0],
["In the NO SPECS scheme, “P” stands for:",["Pain","Proptosis","Pruritus"],1]];

const TX=[
["Graves’ disease: options",["<b>Antithyroid drugs</b> (thionamides): propylthiouracil, carbimazole (not in US), methimazole. Inhibit TPO function; reduce antibody levels.","Initial: carbimazole/methimazole 10–20 mg every 8–12 h (once daily possible after euthyroid); PTU 100–200 mg every 6–8 h.","<b>Titration</b>: reduce to maintenance 2.5–10 mg methimazole/carbimazole or 50–100 mg PTU; or <b>block-replace</b> with levothyroxine.","Review TFTs 4–6 weeks after starting; titrate to unbound T4 (TSH stays suppressed for months). Most are euthyroid by 6–8 weeks.","Remission up to 30–60%, maximal at 12–18 months (titration) or 6 months (block-replace). Relapse more likely in young, male, smokers, severe hyperthyroidism, large goiter.","Follow closely in year 1 after stopping, then at least annually.","<b>Radioiodine</b> (131I) or <b>thyroidectomy</b> for relapse; RAI is first-line in many centres in North America."]],
["Antithyroid drug adverse effects",["Common (1–5%): rash, urticaria, fever, arthralgia; can switch drug or use antihistamine.","Rare: hepatitis (esp. PTU; avoid PTU in children), vasculitis, <b>agranulocytosis (&lt;1%)</b>.","Give written warning: sore throat, fever, mouth ulcers → stop drug and check blood count urgently; never restart after agranulocytosis.","Monitor LFTs if PTU is used."]],
["Radioiodine",["Progressive destruction of thyroid cells; usual dose 370–555 MBq (10–15 mCi); fixed dose based on severity, goiter size, uptake.","Pretreat ≥1 month with antithyroid drug and β-blocker in elderly or cardiac patients; stop carbimazole/methimazole 2–3 days before, restart 3–7 days after; stop PTU longer.","Hypothyroidism risk: 10–20% in year 1 then ~5%/year; most authorities aim for ablation then lifelong LT4.","Contraindications: pregnancy, breast-feeding. Active moderate–severe eye disease: avoid or give prednisone 0.2–0.5 mg/kg/day, taper over 6–12 weeks.","Radiation precautions: avoid close contact with children and pregnant women 5–7 days; conception safe after ~6 months."]],
["Surgery (total / near-total thyroidectomy)",["For relapse after ATD, large goiter, young patients, or preference.","Control with ATD then potassium iodide (SSKI 1–2 drops tid for 10 days) pre-op to reduce vascularity.","Complications (rare in experienced hands): bleeding, hypoparathyroidism, recurrent laryngeal nerve injury; recurrence &lt;2%."]],
["Pregnancy and breast-feeding",["Use antithyroid drugs; titrate to keep serum free/total T4 at or just above the upper reference.","PTU until 14–16 weeks (methimazole/carbimazole embryopathy: aplasia cutis, choanal atresia), then switch to methimazole (15–20 mg PTU ≈ 1 mg methimazole).","Possible to stop in last trimester; TRAb &gt;3× normal or fetal HR &gt;160/min suggests fetal thyrotoxicosis.","Breast-feeding is safe with low-dose methimazole/carbimazole.","Postpartum is a high-risk period for relapse."]],
["Thyroid storm (thyrotoxic crisis)",["Intensive monitoring, supportive care, treat precipitant.","<b>PTU</b> 500–1000 mg load then 250 mg every 4 h (oral/NG/rectal); methimazole 20 mg every 6 h if PTU unavailable.","One hour later: stable iodide (SSKI 5 drops every 6 h) or equivalent to block release (Wolff-Chaikoff).","Propranolol 60–80 mg PO every 4 h or 2 mg IV every 4 h; caution in heart failure; IV esmolol under monitoring.","Hydrocortisone 300 mg IV then 100 mg every 8 h; antibiotics if infection; cholestyramine; cooling, oxygen, IV fluids."]],
["Graves’ ophthalmopathy and dermopathy",["Mild/moderate: spontaneous improvement; control thyroid function, stop smoking, artificial tears, paraffin ointment, dark glasses, head elevation, diuretic for periorbital edema, prisms for diplopia; selenium 100 µg bid considered.","Severe (optic neuropathy, corneal damage): emergency with ophthalmology; IV methylprednisolone 500 mg weekly × 6 then 250 mg weekly × 6; orbital decompression if refractory.","Teprotumumab (FDA 2020): 10 mg/kg IV then 20 mg/kg every 3 weeks × 21 weeks.","Orbital radiotherapy: efficacy unclear. Surgery for diplopia/appearance once stable.","Dermopathy: topical high-potency steroid under occlusive dressing."]],
["Thyroiditis",["<b>Acute (suppurative)</b>: antibiotics guided by FNA culture; drain abscess; evaluate piriform sinus.","<b>Subacute</b>: aspirin/NSAIDs; prednisone 15–40 mg tapering over 6–8 weeks if severe; monitor TFTs every 2–4 weeks; LT4 50–100 µg only if prolonged hypothyroid phase.","<b>Silent/postpartum</b>: β-blocker for symptoms; no steroids; may need LT4, withdraw after 6–9 months; annual follow-up (permanent hypothyroidism in some).","<b>Riedel’s</b>: surgical relief of compression; tamoxifen may help."]],
["Amiodarone-induced thyrotoxicosis",["Stop amiodarone if possible (long half-life, effect persists); do not rely on discontinuation alone.","Type 1: thionamides in high doses, potassium perchlorate 200 mg every 6 h (agranulocytosis risk).","Type 2: glucocorticoids (prednisone 40 mg daily); lithium may help.","Near-total thyroidectomy rapidly effective if patient can undergo it safely."]],
["Subclinical and other",["Subclinical hyperthyroidism: recheck in 6–12 weeks.","Thyrotoxicosis factitia/ectopic: stop hormone; treat cause.","TSH-secreting adenoma: transsphenoidal surgery, irradiation, octreotide; ATD or RAI to control thyrotoxicosis."]]];

function pathView(){return `<div class="card"><h2>Pathophysiology</h2><div class="sub">Tap a topic to expand</div></div>`+PATH.map(p=>`<details><summary>${p[0]}</summary><div><ul>${p[1].map(x=>`<li>${x}</li>`).join("")}</ul></div></details>`).join("")+`<div class="card"><h2>Thyrotoxic phase hormone sequence</h2><ol class="hormone-sequence"><li>Follicular injury</li><li>Tg and T4/T3 released</li><li>TSH suppressed, uptake low</li><li>Stores depleted: hypothyroid phase</li><li>Recovery: TSH and function normalise</li></ol></div>`}
function txView(){return `<div class="card"><h2>Treatment</h2><div class="sub">Based on pp.2939–2945. Doses are as stated in the chapter; verify current guidance.</div><button class="btn sec" onclick="go(4)">Indian brands, manufacturers / marketers &amp; costs</button></div>`+TX.map(p=>`<details><summary>${p[0]}</summary><div><ul>${p[1].map(x=>`<li>${x}</li>`).join("")}</ul></div></details>`).join("")}

const INDIAN_MEDICINE_REVIEW='31 October 2026';
function medEsc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function medView(){return `<div class="card"><h2>Indian medicines: brands & costs</h2><p>Five product examples per medicine class where verified. These are Indian-market listings, not a sales ranking. Import references and classes with fewer verified products are marked.</p><p class="sub">Checked ${INDIAN_MEDICINE_REVIEW}. Static INR references; MRP, listed pack prices and unit prices are labelled separately. Verify the current pack, batch price, strength, formulation and stock. Company roles follow the source; where only a marketer/supplier is known, the actual manufacturing site has not been inferred. Strength is not a prescription.</p><p class="sub">Scroll each table horizontally to see company, pack, cost and source details.</p><label for="med-search">Search generic, brand, company, strength or class</label><input id="med-search" type="search" placeholder="e.g. carbimazole, Abbott, selenium…" oninput="renderMedicines()"><div class="grid med-filters"><div><label for="med-class">Medicine class</label><select id="med-class" onchange="renderMedicines()"><option value="">All classes</option>${[...new Set(INDIAN_MEDICINES.map(g=>g.category))].map(c=>`<option>${medEsc(c)}</option>`).join('')}</select></div><div><label for="med-type">Product type</label><select id="med-type" onchange="renderMedicines()"><option value="">All products</option><option value="combo">Combination products</option><option value="single">Single ingredient</option><option value="quote">Price quotation required</option></select></div></div><button class="btn sec" onclick="resetMedicines()">Clear filters</button><p id="med-count" role="status" aria-live="polite" class="sub"></p></div>
<details><summary>Combination therapy & clinical context</summary><div><p><b>Antithyroid drug + beta blocker:</b> separately prescribed products; the beta blocker controls symptoms. No verified Indian fixed-dose antithyroid/beta-blocker catalogue is claimed.</p><p><b>Block and replace:</b> antithyroid drug plus levothyroxine is a specialist regimen of separate medicines. Dose titration is generally preferred because block-and-replace can increase adverse effects. It is not routine pregnancy therapy; rare fetal indications need specialist care.</p><p><b>Thyroid storm:</b> thionamide, appropriately sequenced iodide, glucocorticoid and selected beta blockade form an emergency hospital regimen, not a combination tablet. Listed ocular lubricant combinations support eye comfort; they do not treat thyroid hormone excess.</p><p>Carbimazole, methimazole and PTU must not be taken together or switched without a prescription. Fever, sore throat or mouth ulcers while taking a thionamide: stop the medicine and seek urgent assessment/CBC. Antihistamines do not replace that assessment.</p><p class="sub"><a href="https://doi.org/10.1089/thy.2016.0229" target="_blank" rel="noopener noreferrer">ATA hyperthyroidism guideline</a> · <a href="https://www.thyroid.org/patient-thyroid-information/ct-for-patients/may-2017/vol-10-issue-5-p-3-7/" target="_blank" rel="noopener noreferrer">ATA pregnancy guidance</a> · <a href="https://pubmed.ncbi.nlm.nih.gov/24991217/" target="_blank" rel="noopener noreferrer">Thyroid status and warfarin response</a></p></div></details>
<details><summary>Coverage gaps: prednisone, perchlorate & unspecified classes</summary><div><p><b>Prednisone:</b> a current Indian retail brand, pack-specific price and manufacturer were not verified. Prednisolone and methylprednisolone entries are labelled as different drugs; they are not automatic substitutes for a prednisone prescription.</p><p><b>Potassium perchlorate:</b> no current Indian medicinal product, manufacturer and pack-specific INR price verified. Laboratory reagent prices are excluded. Specialist procurement and toxicity monitoring are essential.</p><p><b>Antibiotics:</b> the chapter mentions culture-directed antibiotics for infection without naming an agent. No arbitrary five-brand antibiotic recommendation is implied. Likewise, amiodarone, interferon, TKIs and checkpoint inhibitors are potential causes discussed in the assessment, not treatment suggestions.</p><p>Limited verified products: PTU (1), cholestyramine (2), paraffin eye preparation (1), selenium (3), SSKI import reference (1), teprotumumab named-patient reference (1), and radioiodine formulations (2). Fewer listings are shown rather than inventing five brands or treating different strengths as distinct brands.</p></div></details><div id="med-results"></div>`;}
function resetMedicines(){['med-search','med-class','med-type'].forEach(id=>document.getElementById(id).value='');renderMedicines();}
function renderMedicines(){
 const terms=document.getElementById('med-search').value.trim().toLowerCase().split(/\s+/).filter(Boolean),category=document.getElementById('med-class').value,type=document.getElementById('med-type').value;
 let count=0,groupCount=0;
 const html=INDIAN_MEDICINES.map(g=>{
  if(category&&g.category!==category)return '';
  const rows=g.rows.filter(r=>{
   if(type==='combo'&&!r.combination||type==='single'&&r.combination||type==='quote'&&r.price!==null)return false;
   const haystack=[g.name,g.category,r.brand,r.composition,r.company,r.availability,r.combination?'combination FDC':'single ingredient'].join(' ').toLowerCase();
   return terms.every(t=>haystack.includes(t));
  });
  if(!rows.length)return '';count+=rows.length;groupCount++;
  return `<details class="medicine-group"${terms.length||category||type?' open':''}><summary>${medEsc(g.name)} <span class="med-tag">${rows.length} product${rows.length===1?'':'s'}</span></summary><div><p class="sub">${medEsc(g.category)}</p><p>${medEsc(g.note)}</p><div class="scroll med-table" tabindex="0" role="region" aria-label="${medEsc(g.name)} medicine table"><table class="tbl"><thead><tr><th scope="col">Brand</th><th scope="col">Composition / strength</th><th scope="col">Manufacturer / marketer</th><th scope="col">Pack or price unit</th><th scope="col">Reference cost (INR)</th><th scope="col">Availability / source</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${medEsc(r.brand)}</b>${r.combination?'<br><span class="med-tag">Combination</span>':''}</td><td>${medEsc(r.composition)}</td><td>${medEsc(r.company)}</td><td>${medEsc(r.unit)}</td><td>${r.price===null?'Not verified — request quote':'₹'+r.price.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}<br><span class="sub">${medEsc(r.priceType)}</span></td><td>${medEsc(r.availability)}<br><a href="${medEsc(r.source)}" target="_blank" rel="noopener noreferrer" aria-label="${medEsc(r.brand)} product and price source">Product / price source</a></td></tr>`).join('')}</tbody></table></div></div></details>`;
 }).join('');
 document.getElementById('med-results').innerHTML=html||'<div class="card">No medicines match these filters.</div>';
 document.getElementById('med-count').textContent=count+' product entries across '+groupCount+' medicine groups • checked '+INDIAN_MEDICINE_REVIEW;
}


function quiz(){
const q=document.getElementById("quiz");if(!q)return;
q.innerHTML=QZ.map((x,i)=>`<div class="q"><b>${i+1}. ${x[0]}</b>${x[1].map((o,j)=>`<button onclick="ans(this,${j},${x[2]})">${o}</button>`).join("")}</div>`).join("")}
function ans(b,j,c){const p=b.parentNode;if(p.dataset.d)return;p.dataset.d=1;b.classList.add(j==c?"r":"w");if(j!=c)p.querySelectorAll("button")[c].classList.add("r")}

function render(){
const m=document.getElementById("main");
m.innerHTML=[assessView,pathView,()=>LEARN,txView,medView][tab]();
if(tab==2)quiz();
if(tab==4)renderMedicines();
}
nav();render();
